general {
    lock_cmd = pidof hyprlock || hyprlock                                     # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session                                  # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # to avoid having to press a key twice to turn on the display.
}

# Timeouts go through scripts/idle.sh:
#   "battery" listeners only act on the laptop while unplugged (short times),
#   "default" listeners act on the desktop and on the laptop while plugged in.
# Resume actions are shared and only undo what was actually done.

# ---------- Laptop on battery ----------

listener {
    timeout = 180                                                   # 3min
    on-timeout = ~/.config/hypr/scripts/idle.sh battery dim
    on-resume = ~/.config/hypr/scripts/idle.sh always undim
}

listener {
    timeout = 180                                                   # 3min
    on-timeout = ~/.config/hypr/scripts/idle.sh battery kbd-off
    on-resume = ~/.config/hypr/scripts/idle.sh always kbd-on
}

listener {
    timeout = 300                                                   # 5min
    on-timeout = ~/.config/hypr/scripts/idle.sh battery lock
}

listener {
    timeout = 300                                                   # 5min
    on-timeout = ~/.config/hypr/scripts/idle.sh battery screen-off
    on-resume = ~/.config/hypr/scripts/idle.sh always screen-on
}

listener {
    timeout = 900                                                   # 15min
    on-timeout = ~/.config/hypr/scripts/idle.sh battery suspend
}

# ---------- Desktop / laptop plugged in ----------

listener {
    timeout = 1200                                                  # 20min
    on-timeout = ~/.config/hypr/scripts/idle.sh default dim
    on-resume = ~/.config/hypr/scripts/idle.sh always undim
}

listener {
    timeout = 1200                                                  # 20min
    on-timeout = ~/.config/hypr/scripts/idle.sh default kbd-off
    on-resume = ~/.config/hypr/scripts/idle.sh always kbd-on
}

listener {
    timeout = 2400                                                  # 40min
    on-timeout = ~/.config/hypr/scripts/idle.sh default lock
}

listener {
    timeout = 3600                                                  # 60min
    on-timeout = ~/.config/hypr/scripts/idle.sh default screen-off
    on-resume = ~/.config/hypr/scripts/idle.sh always screen-on
}

listener {
    timeout = 5400                                                  # 90min
    on-timeout = ~/.config/hypr/scripts/idle.sh default suspend
}
