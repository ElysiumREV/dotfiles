[config]
[templates]
kitty = { input_path = "./templates/kitty-colors.conf", output_path = '~/.config/kitty/themes/Matugen.conf', post_hook = "kitty +kitten themes --reload-in=all Matugen" }

gtk3 = { input_path = "./templates/gtk-colors.css", output_path = "~/.config/gtk-3.0/colors.css", post_hook = 'sh ~/.config/matugen/post-hook-scripts/gtk-themes-reload.sh {{mode}}' }
gtk4 = { input_path = "./templates/gtk-colors.css", output_path = "~/.config/gtk-4.0/colors.css", post_hook = 'sh ~/.config/matugen/post-hook-scripts/gtk-themes-reload.sh {{mode}}' }

quickshell = { input_path = "./templates/quickshell.json", output_path = '~/.local/state/quickshell/generated/colors.json' }

steam = { input_path = './templates/steam.css', output_path = '~/.config/AdwSteamGtk/custom.css', post_hook =  'adwaita-steam-gtk -i' }

mako = { input_path = './templates/mako', output_path = '~/.config/mako/mako-colors', post_hook = 'makoctl reload' }

spotify = { input_path = './templates/spicetify.ini', output_path = '~/.config/spicetify/Themes/Sleek/color.ini', post_hook = 'pgrep -x spicetify > /dev/null || spicetify apply -n' }

zed = { input_path = './templates/zed-colors.json', output_path = '~/.config/zed/themes/matugen.json' }