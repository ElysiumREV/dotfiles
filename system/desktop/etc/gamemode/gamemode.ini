; Instalado em /etc/gamemode.ini por system/desktop/apply.sh.
; Uso: gamemoderun %command% nas opções de inicialização da Steam.

[general]
; O jogo roda com nice -10 (precisa estar no grupo "gamemode")
renice = 10
softrealtime = auto
inhibit_screensaver = 1

[gpu]
; Fixa o clock da GPU AMD no máximo enquanto o jogo roda; volta para "auto"
; quando o jogo fecha. gpu_device é o N de /sys/class/drm/cardN, preenchido
; pelo apply.sh.
apply_gpu_optimisations = accept-responsibility
gpu_device = @GPU_DEVICE@
amd_performance_level = high
